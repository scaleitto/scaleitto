# Builds the production bundle on GitHub (shared hosting has too little memory
# to run `next build`), runs the tests against it, then publishes it.
# Download the "scaleitto-build" artifact from the run page and upload it to
# the server — see DEPLOYMENT.md.
name: Build

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: scaleitto
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/scaleitto
      APP_URL: http://localhost:3000
      ROOT_DOMAIN: localhost
      PLATFORM_ADMIN_EMAIL: admin@scaleitto.com
      # Fake delivery company server started by the e2e tests
      E2E_CARRIER_URL: http://127.0.0.1:4010
      # Fake OpenAI server started by the e2e tests (landing pages AI)
      OPENAI_BASE_URL: http://127.0.0.1:4020/v1
      OPENAI_API_KEY: sk-test
      # Fake Meta / TikTok / Google server started by the e2e tests (server-side pixel events)
      E2E_PIXEL_URL: http://127.0.0.1:4030
      # Fake Stripe / PayPal / SATIM (CIB, Edahabia) payment servers (the same fake server)
      E2E_PAYMENT_URL: http://127.0.0.1:4030
      # The platform's own SATIM terminal (credit packs paid online with CIB / Edahabia); accepted by the fake server
      PLATFORM_SATIM_USER: good-user
      PLATFORM_SATIM_PASSWORD: good-pass
      PLATFORM_SATIM_TERMINAL: E010900000
      # The platform's WhatsApp number (WhatsApp confirmation app), sent to the fake Meta server above
      WHATSAPP_TOKEN: good-token
      WHATSAPP_PHONE_ID: "100200300"
      WHATSAPP_APP_SECRET: wa-app-secret
      WHATSAPP_VERIFY_TOKEN: wa-verify
      # Fake Google Sheets script / webhook / Shopify store / YouCan API (apps); local URLs allowed in tests only
      E2E_APPS_URL: http://127.0.0.1:4040
      # Cloudflare Turnstile (checkout captcha): Cloudflare's always-pass test site key, answers checked by the fake server above
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: test-turnstile-secret
      E2E_TURNSTILE_URL: http://127.0.0.1:4040
      ALLOW_PRIVATE_FETCH: "1"
      # Plan payments shown to merchants (no RIB: that method stays hidden)
      PAYMENT_HOLDER: Scaleitto SARL
      PAYMENT_CCP: "0012345678 clé 90"
      PAYMENT_WHATSAPP: "+213 555 00 11 22"
      # Custom domains: where merchants point them, and a fake DNS resolver for the tests
      DOMAIN_CNAME_TARGET: stores.scaleitto.test
      E2E_DNS_URL: http://127.0.0.1:4040
      # The emails the app sends (account confirmation, new password) go to the same fake server
      E2E_MAIL_URL: http://127.0.0.1:4040/mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assemble deploy folder
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          cp -r drizzle scripts .next/standalone/
          cp .env.example .next/standalone/.env.example
      - name: End-to-end tests against the deploy folder
        run: |
          # Start from a latin1 database, as cPanel can create them: the app must convert it at startup
          mysql -h 127.0.0.1 -uroot -proot -e "ALTER DATABASE scaleitto CHARACTER SET latin1 COLLATE latin1_swedish_ci"
          npx playwright install --with-deps chromium
          (cd .next/standalone && PORT=3000 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          npm run test:e2e
      - if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        with:
          name: scaleitto-build
          path: .next/standalone
          include-hidden-files: true
          retention-days: 3
